[project]
name = "torch-anthropic-demo"
version = "0.1.0"
description = "Lesson 06 Exercise 3 - a project that needs PyTorch and the Anthropic SDK"
requires-python = ">=3.11"
dependencies = [
    "torch==2.15.0",
    "anthropic",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
